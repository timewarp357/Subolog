
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./bulma.css">
  <!-- <link href="https://cdn.jsdelivr.net/npm/lism-css@1.1.0/dist/css/main.css" rel="stylesheet" /> -->
  
  <title>編成&nbsp;&#45;&nbsp;Subolog</title>

  <script data-goatcounter="https://timewarp.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>
  <header class="">
    <nav class="navbar has-background-grey-lighter" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <h3 class="title is-3">
          <a class="navbar-item" href="./index.html">Subolog</a>
        </h3>
      </div>
      <div id="navbarBasicExample" class="navbar-menu">
        <div class="navbar-start">
          <a class="navbar-item" href="./index.html">編成</a>
          <a class="navbar-item" href="./statistics.html">統計</a>
          <a class="navbar-item" href="./about.html">概要</a>
        </div>
      </div>
    </nav>
  </header>

<main>
<div class="container">
  <div class="section">
    <div class="content">

      <div class="modal is-info" id="modal-window">
        <div class="modal-background"></div>
        <div class="modal-content">
          <div class="box" id="modal-value"></div>
        </div>
        <button class="modal-close is-large" aria-label="close" id="close-modal"></button>
      </div>
      
      <!-- <h3>ダンジョン検索</h3> -->
      <p>
        「サモンズボード」で筆者が使用した編成を記録したサイトです。<br>
        最近使用した編成から新しいもの順に表示しています。
      </p>
      <p>
        各項目の解説は<a href="./index-info.html">こちら</a>
      </p>
    </div>

    <div class="level">
      <div class="level-left">
        <div class="level-item">
          <span class="content is-small">最大表示件数&nbsp;</span>
        </div>
        <div class="level-item">
          <input class="input" type="number" id="count" min="1" max="100" step="1" value="20" required>
        </div>
        <div class="level-item">
          <span class="content is-small">&nbsp;件数変更</span>
        </div>
        <div class="level-item">
          <div class="field has-addons">
            <p class="control">
              <button class="button" type="button" onclick="setNumber(20)">20</button>
            </p>
            <p class="control">
              <button class="button" type="button" onclick="setNumber(50)">50</button>
            </p>
            <p class="control">
              <button class="button" type="button" onclick="setNumber(100)">100</button>
            </p>
          </div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="column is-half">
        <input type="search" id="keyword" placeholder="キーワード検索" class="input">
      </div>
    </div>
    
    <div class="content">
      <div class="checkboxes">
        <label class="checkbox">
          <input type="checkbox" id="filter-metsu" role="switch" />
          <span class="content is-small">滅</span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="filter-auto" role="switch" />
          <span class="content is-small">AUTO</span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="filter-daily" role="switch" />
          <span class="content is-small">日課</span>
        </label>
      </div>
    </div>

    <div class="level">
      <div class="level-left">
        <div class="level-item">
          <span class="content" id="results-status" role="status">読み込み中...</span>
        </div>
      </div>
      <div class="level-right">
        <div class="level-item">
          <div class="field has-addons">
            <p class="control">
              <button class="button is-small" type="button" id="open-all">OPEN</button>
            </p>
            <p class="control">
              <button class="button is-small" type="button" id="close-all">CLOSE</button>
            </p>
          </div>
        </div>
        <div class="level-item">
          <button class="button is-small" type="button" id="toggleBtn" onclick="toggleArrow()" aria-label="昇順に切り替え" title="昇順に切り替え">&#9660;</button>
        </div>
      </div>
    </div>
    <table class="table is-striped is-fullwidth">
      <thead>
        <tr>
          <th class="has-text-centered">ダンジョン</th>
          <th class="has-text-centered">フロア</th>
          <th class="has-text-centered">ボス</th>
          <th class="has-text-centered">編成（配置）</th>
          <th class="has-text-centered"><abbr title="TURN">T</abbr></th>
          <th class="has-text-centered">AUTO</th>
          <th class="has-text-centered"><abbr title="対応したMISSION,攻略手順">&#9432;</abbr></th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
      <tfoot>
        <tr>
          <th class="has-text-centered">ダンジョン</th>
          <th class="has-text-centered">フロア</th>
          <th class="has-text-centered">ボス</th>
          <th class="has-text-centered">編成（配置）</th>
          <th class="has-text-centered">T</th>
          <th class="has-text-centered">AUTO</th>
          <th class="has-text-centered"><abbr title="対応したMISSION,攻略手順">&#9432;</abbr></th>
        </tr>
      </tfoot>
    </table>
    <div class="content">
      <a class="">TOPに戻る</a>
    </div>
  </div>
</div>
</main>

<footer class="footer has-background-grey-lighter">
  <div class="content has-text-centered">
    <h4 class="title is-4">
      <a class="has-text-grey-dark" href="./index.html">Subolog</a>
    </h4>
  </div>
</footer>

  <script>
  const JSON_URL = './data.json';

  let allData = [];
  let metsuOnly = false;
  let autoOnly = false;
  let dailyOnly = false;
  let descending = true;

  // 表示する列名
  const columnNames = [
    'ダンジョン',
    'フロア',
    'ボス',
    'モンスター（配置）',
    'TURN',
    'AUTO',
    'MISSION'
  ];

  const keyword = document.getElementById('keyword');
  const results = document.getElementById('results');
  const cardResults = document.getElementById('card-results');
  const count = document.getElementById('count');
  const resultsStatus = document.getElementById('results-status');
  const filterMetsu = document.getElementById('filter-metsu');
  const filterAuto = document.getElementById('filter-auto');
  const filterDaily = document.getElementById('filter-daily');

  // JSONデータを取得
  async function loadData() {
    try {
      const response = await fetch(JSON_URL, {
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error('JSON取得エラー');
      }

      allData = await response.json();

      render();

    } catch (error) {
      console.error(error);
      resultsStatus.textContent = 'データ取得に失敗しました';
    }
  }

  // 検索・テーブルの表示
  function render() {
    if (!count.checkValidity()) return;
    const displayCount = count.valueAsNumber;
    const q = keyword.value.trim().toLowerCase();

    const matched = allData.filter(row => {
      const rowValues = Object.values(row);
      const isMetsu = String(row['フロア'] ?? '').includes('滅');
      // Auto列は表示時と同じくJSONの9番目（0始まり）を参照
      const hasAuto = String(rowValues[10] ?? '').trim() !== '';
      const isDaily = String(row['日課'] ?? '').trim() === '〇';
      const matchesKeyword = q === '' || rowValues.some(value =>
        String(value ?? '').toLowerCase().includes(q)
      );
      return (!metsuOnly || isMetsu) && (!autoOnly || hasAuto) && (!dailyOnly || isDaily) && matchesKeyword;
    });

    // 検索・絞り込み後の末尾から指定件数を表示
    const filtered = matched.slice(-displayCount);
    if (descending) filtered.reverse();

    resultsStatus.textContent = `${filtered.length}件表示（${matched.length}件のうち）`;

    results.replaceChildren();

    filtered.forEach((row, rowIndex) => {
      const tr = document.createElement('tr');

      // JSONの1、2、3、４、8、9、10番目を左から順に表示
      const rowValues = Object.values(row);
      const values = [1, 2, 3, 4, 9, 10, 11].map(index => rowValues[index]);
      const positions = String(rowValues[8] ?? '').split('');
      const formatMember = columnIndex => {
        const member = rowValues[columnIndex] ?? '';
        const position = positions[columnIndex - 4];
        return position === undefined ? String(member) : `${member} (${position})`;
      };

      const createMembers = () => {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const content = document.createElement('div');

        summary.textContent = '\u265A\u00a0' + formatMember(4);

        [5, 6, 7].forEach(columnIndex => {
          const line = document.createElement('div');
          line.textContent = formatMember(columnIndex);
          content.appendChild(line);
        });

        details.appendChild(summary);
        details.appendChild(content);
        return details;
      };

      values.forEach((value, index) => {
        const td = document.createElement('td');

        // 左から4番目（番号は0始まり）
        if (index === 3) {
          td.appendChild(createMembers());
        } else if (index === 6) {
          if (String(value ?? '').trim() !== '') {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'button is-small js-modal-trigger';
            button.dataset.target = 'modal-window';
            button.dataset.content = String(value);
            button.textContent = '詳細';
            td.appendChild(button);
          }
        } else {
          td.textContent = value ?? '';
        }

        tr.appendChild(td);
      });

      results.appendChild(tr);

    });
  }

  function setNumber(num) {
    document.getElementById("count").value = num;
    render();
  }

  function toggleArrow() {
    const btn = document.getElementById("toggleBtn");

    descending = !descending;
    btn.textContent = descending ? "▼" : "▲";
    const label = descending ? '昇順に切り替え' : '降順に切り替え';
    btn.setAttribute('aria-label', label);
    btn.title = label;
    render();
  }

  function closeTooltips() {
    document.querySelectorAll('#results .tooltip-trigger[aria-expanded="true"], #card-results .tooltip-trigger[aria-expanded="true"]').forEach(button => {
      button.setAttribute('aria-expanded', 'false');
    });
  }

  // clickはタップ・マウス・キーボードのボタン操作に共通で対応
  document.addEventListener('click', event => {
    const button = event.target.closest('.tooltip-trigger');
    if (button && (results.contains(button) || cardResults.contains(button))) {
      const wasOpen = button.getAttribute('aria-expanded') === 'true';
      closeTooltips();
      button.setAttribute('aria-expanded', String(!wasOpen));
    } else if (!event.target.closest('.tooltip')) {
      closeTooltips();
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      const button = document.querySelector('#results .tooltip-trigger[aria-expanded="true"], #card-results .tooltip-trigger[aria-expanded="true"]');
      if (button) {
        closeTooltips();
        button.focus();
      }
    }
  });

  keyword.addEventListener('input', render);
  count.addEventListener('input', render);

  filterMetsu.addEventListener('change', () => {
    metsuOnly = filterMetsu.checked;
    render();
  });

  filterAuto.addEventListener('change', () => {
    autoOnly = filterAuto.checked;
    render();
  });

  filterDaily.addEventListener('change', () => {
    dailyOnly = filterDaily.checked;
    render();
  });

  document.getElementById('open-all').addEventListener('click', () => {
    document.querySelectorAll('#results details, #card-results details').forEach(details => {
      details.open = true;
    });
  });

  document.getElementById('close-all').addEventListener('click', () => {
    document.querySelectorAll('#results details, #card-results details').forEach(details => {
      details.open = false;
    });
  });

  document.addEventListener('DOMContentLoaded', () => {
    // Functions to open and close a modal
    function openModal($el) {
      $el.classList.add('is-active');
    }

    function closeModal($el) {
      $el.classList.remove('is-active');
    }

    function closeAllModals() {
      (document.querySelectorAll('.modal') || []).forEach(($modal) => {
        closeModal($modal);
      });
    }

    // Render後に追加されるボタンにも対応する
    document.addEventListener('click', (event) => {
      const $trigger = event.target.closest('.js-modal-trigger');
      if (!$trigger) return;

      const $target = document.getElementById($trigger.dataset.target);
      if (!$target) return;
      $target.querySelector('#modal-value').textContent = $trigger.dataset.content;
      openModal($target);
    });

    // Add a click event on various child elements to close the parent modal
    (document.querySelectorAll('.modal-background, .modal-close, .modal-card-head .delete, .modal-card-foot .button') || []).forEach(($close) => {
      const $target = $close.closest('.modal');

      $close.addEventListener('click', () => {
        closeModal($target);
      });
    });

    // Add a keyboard event to close all modals
    document.addEventListener('keydown', (event) => {
      if(event.key === "Escape") {
        closeAllModals();
      }
    });
  });

  loadData();
  </script>

</body>
</html>
