
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./style.css">
  <!-- <link href="https://cdn.jsdelivr.net/npm/lism-css@1.1.0/dist/css/main.css" rel="stylesheet" /> -->
  
  <title>編成&nbsp;&#45;&nbsp;Subolog</title>

  <script data-goatcounter="https://timewarp.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>
  <header class="site-header" id="top" tabindex="-1">
    <h3 class="site-title">
      <a href="./index.html">Subolog</a>
    </h3>

    <nav class="site-nav" aria-label="メインナビゲーション">
      <ul>
        <li><a href="./index.html" aria-current="page">編成</a></li>
        <li><a href="./statistics.html">統計</a></li>
        <!-- <li><a href="./dungeon.html">ダンジョン</a></li> -->
        <li><a href="./about.html">概要</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-background">
  <div class="container">
    
    <!-- <h3>ダンジョン検索</h3> -->
    <p>
      「サモンズボード」で筆者が使用した編成を記録したサイトです。
    </p>
    <p>
      各項目の解説は<a href="./index-info.html">こちら</a>
    </p>

    <div>
      <span class="input-info">最大表示件数&nbsp;</span>
      <input type="number" id="count" min="1" max="100" step="1" value="20" required class="form-input">
      <span class="input-info">&nbsp;件数変更&nbsp;>&nbsp;</span>
      <button class="button-counter" type="button" onclick="setNumber(20)">20</button>
      <button class="button-counter" type="button" onclick="setNumber(50)">50</button>
      <button class="button-counter" type="button" onclick="setNumber(100)">100</button>
      <br>
      <input type="search" id="keyword" placeholder="キーワード検索" class="form-input">
      <br>
    </div>
    
    <div class="results-toolbar">
      <div class="results-filters">
        <!-- <span>FILTER&nbsp;</span> -->
        <label class="auto-filter">
          <span>滅</span>
          <input type="checkbox" id="filter-metsu" role="switch">
          <span class="toggle-track" aria-hidden="true"></span>
        </label>
        <label class="auto-filter">
          <span>AUTO</span>
          <input type="checkbox" id="filter-auto" role="switch">
          <span class="toggle-track" aria-hidden="true"></span>
        </label>
        <label class="auto-filter">
          <span>日課</span>
          <input type="checkbox" id="filter-daily" role="switch">
          <span class="toggle-track" aria-hidden="true"></span>
        </label>
      </div>
    </div>
    <div class="results-summary">
      <span id="results-status" role="status">読み込み中...</span>
      <div class="details-controls" role="group" aria-labelledby="details-label">
        <!-- <span id="details-label">編成</span> -->
        <button type="button" id="open-all">OPEN</button>
        <button type="button" id="close-all">CLOSE</button>
        <button type="button" id="toggleBtn" onclick="toggleArrow()" aria-label="昇順に切り替え" title="昇順に切り替え">&#9660;</button>
      </div>
    </div>

    <div class="table-container index-table-container">
      <table class="index-table">
        <thead>
          <tr>
            <th>ダンジョン</th>
            <th>フロア</th>
            <th>ボス</th>
            <th>編成（配置）</th>
            <th>T</th>
            <th>AUTO</th>
            <th>備考</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
    <ul id="card-results" class="card-results" aria-label="編成一覧"></ul>
    <p>
      <a class="back-to-top" href="#top" aria-label="ページの先頭に戻る">TOPに戻る</a>
    </p>
  
  </div>
  </main>

  <footer class="site-footer">
    <small class="site-footer-title">Subolog</small>
  </footer>

  <script>
  const JSON_URL = './data.json';

  let allData = [];
  let metsuOnly = false;
  let autoOnly = false;
  let dailyOnly = false;
  let descending = true;

  // 表示する列名
  const columnNames = [
    'ダンジョン',
    'フロア',
    'ボス',
    'モンスター（配置）',
    'TURN',
    'AUTO',
    'MISSION'
  ];

  const keyword = document.getElementById('keyword');
  const results = document.getElementById('results');
  const cardResults = document.getElementById('card-results');
  const count = document.getElementById('count');
  const resultsStatus = document.getElementById('results-status');
  const filterMetsu = document.getElementById('filter-metsu');
  const filterAuto = document.getElementById('filter-auto');
  const filterDaily = document.getElementById('filter-daily');

  // JSONデータを取得
  async function loadData() {
    try {
      const response = await fetch(JSON_URL, {
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error('JSON取得エラー');
      }

      allData = await response.json();

      render();

    } catch (error) {
      console.error(error);
      resultsStatus.textContent = 'データ取得に失敗しました';
    }
  }

  function createMissionTooltip(value, rowIndex, view) {
    if (String(value ?? '').trim() === '') return null;

    const tooltip = document.createElement('span');
    tooltip.className = 'tooltip';

    const tooltipButton = document.createElement('button');
    tooltipButton.type = 'button';
    tooltipButton.className = 'tooltip-trigger';
    tooltipButton.textContent = '詳細';
    tooltipButton.setAttribute('aria-expanded', 'false');

    const tooltipText = document.createElement('span');
    tooltipText.className = 'tooltip-text';
    tooltipText.id = `mission-tooltip-${view}-${rowIndex}`;
    tooltipText.setAttribute('role', 'tooltip');
    tooltipText.textContent = String(value);
    tooltipButton.setAttribute('aria-controls', tooltipText.id);
    tooltipButton.setAttribute('aria-describedby', tooltipText.id);

    tooltip.append(tooltipButton, tooltipText);
    return tooltip;
  }

  function createCardField(label, value, className = '') {
    const field = document.createElement('div');
    field.className = `formation-card-field ${className}`.trim();
    const heading = document.createElement('span');
    heading.className = 'formation-card-label';
    heading.textContent = label;
    const content = document.createElement('div');
    content.className = 'formation-card-value';
    if (value instanceof Node) {
      content.appendChild(value);
    } else {
      content.textContent = String(value ?? '').trim() || '—';
    }
    field.append(heading, content);
    return field;
  }

  // 検索・テーブルとカードの表示
  function render() {
    if (!count.checkValidity()) return;
    const displayCount = count.valueAsNumber;
    const q = keyword.value.trim().toLowerCase();

    const matched = allData.filter(row => {
      const rowValues = Object.values(row);
      const isMetsu = String(row['フロア'] ?? '').includes('滅');
      // Auto列は表示時と同じくJSONの9番目（0始まり）を参照
      const hasAuto = String(rowValues[10] ?? '').trim() !== '';
      const isDaily = String(row['日課'] ?? '').trim() === '〇';
      const matchesKeyword = q === '' || rowValues.some(value =>
        String(value ?? '').toLowerCase().includes(q)
      );
      return (!metsuOnly || isMetsu) && (!autoOnly || hasAuto) && (!dailyOnly || isDaily) && matchesKeyword;
    });

    // 検索・絞り込み後の末尾から指定件数を表示
    const filtered = matched.slice(-displayCount);
    if (descending) filtered.reverse();

    resultsStatus.textContent = `${filtered.length}件表示（${matched.length}件のうち）`;

    results.replaceChildren();
    cardResults.replaceChildren();

    filtered.forEach((row, rowIndex) => {
      const tr = document.createElement('tr');

      // JSONの1、2、3、４、8、9、10番目を左から順に表示
      const rowValues = Object.values(row);
      const values = [1, 2, 3, 4, 9, 10, 11].map(index => rowValues[index]);
      const positions = String(rowValues[8] ?? '').split('');
      const formatMember = columnIndex => {
        const member = rowValues[columnIndex] ?? '';
        const position = positions[columnIndex - 4];
        return position === undefined ? String(member) : `${member} (${position})`;
      };

      const createMembers = () => {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const content = document.createElement('div');

        summary.textContent = '\u265A\u00a0' + formatMember(4);

        [5, 6, 7].forEach(columnIndex => {
          const line = document.createElement('div');
          line.textContent = formatMember(columnIndex);
          content.appendChild(line);
        });

        details.appendChild(summary);
        details.appendChild(content);
        return details;
      };

      values.forEach((value, index) => {
        const td = document.createElement('td');

        // 左から4番目（番号は0始まり）
        if (index === 3) {
          td.appendChild(createMembers());
        } else if (index === 6) {
          // JSONのインデックス11（Mis）は、テーブルでは7列目
          // MISSIONの元の値はHTMLとして解釈せず、吹き出し内に表示
          const tooltip = createMissionTooltip(value, rowIndex, 'table');
          if (tooltip) td.appendChild(tooltip);
        } else {
          td.textContent = value ?? '';
        }

        tr.appendChild(td);
      });

      results.appendChild(tr);

      const card = document.createElement('li');
      card.className = 'formation-card';
      const heading = document.createElement('div');
      heading.className = 'formation-card-heading';
      heading.append(
        createCardField('ダンジョン', values[0]),
        createCardField('フロア', values[1])
      );
      const metadata = document.createElement('div');
      metadata.className = 'formation-card-meta';
      const turnValue = String(values[4] ?? '').trim();
      metadata.append(
        createCardField('T', turnValue ? `${turnValue}ターン` : '—'),
        createCardField('AUTO', values[5]),
        createCardField('備考', createMissionTooltip(values[6], rowIndex, 'card') ?? '—')
      );
      card.append(
        heading,
        createCardField('ボス', values[2]),
        createCardField('編成（配置）', createMembers()),
        metadata
      );
      cardResults.appendChild(card);
    });
  }

  function setNumber(num) {
    document.getElementById("count").value = num;
    render();
  }

  function toggleArrow() {
    const btn = document.getElementById("toggleBtn");

    descending = !descending;
    btn.textContent = descending ? "▼" : "▲";
    const label = descending ? '昇順に切り替え' : '降順に切り替え';
    btn.setAttribute('aria-label', label);
    btn.title = label;
    render();
  }

  function closeTooltips() {
    document.querySelectorAll('#results .tooltip-trigger[aria-expanded="true"], #card-results .tooltip-trigger[aria-expanded="true"]').forEach(button => {
      button.setAttribute('aria-expanded', 'false');
    });
  }

  // clickはタップ・マウス・キーボードのボタン操作に共通で対応
  document.addEventListener('click', event => {
    const button = event.target.closest('.tooltip-trigger');
    if (button && (results.contains(button) || cardResults.contains(button))) {
      const wasOpen = button.getAttribute('aria-expanded') === 'true';
      closeTooltips();
      button.setAttribute('aria-expanded', String(!wasOpen));
    } else if (!event.target.closest('.tooltip')) {
      closeTooltips();
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      const button = document.querySelector('#results .tooltip-trigger[aria-expanded="true"], #card-results .tooltip-trigger[aria-expanded="true"]');
      if (button) {
        closeTooltips();
        button.focus();
      }
    }
  });

  keyword.addEventListener('input', render);
  count.addEventListener('input', render);

  filterMetsu.addEventListener('change', () => {
    metsuOnly = filterMetsu.checked;
    render();
  });

  filterAuto.addEventListener('change', () => {
    autoOnly = filterAuto.checked;
    render();
  });

  filterDaily.addEventListener('change', () => {
    dailyOnly = filterDaily.checked;
    render();
  });

  document.getElementById('open-all').addEventListener('click', () => {
    document.querySelectorAll('#results details, #card-results details').forEach(details => {
      details.open = true;
    });
  });

  document.getElementById('close-all').addEventListener('click', () => {
    document.querySelectorAll('#results details, #card-results details').forEach(details => {
      details.open = false;
    });
  });

  loadData();
  </script>

</body>
</html>
