
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./bulma.css">
  
  <title>編成&nbsp;&#45;&nbsp;Subolog</title>

  <!-- <script data-goatcounter="https://timewarp.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script> -->
</head>

<body id="top">
  <header class="">
    <nav class="navbar has-shadow">
      <div class="navbar-brand">
        <h2 class="title is-2">
          <a class="navbar-item" href="./index.html">Subolog</a>
        </h2>
        <button type="button" class="navbar-burger" aria-label="メニュー" aria-expanded="false" aria-controls="site-navbar-menu">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
      </div>
      <div id="site-navbar-menu" class="navbar-menu">
        <a class="navbar-item" href="./index.html" aria-current="page">編成</a>
        <a class="navbar-item" href="./statistics.html">統計</a>
        <a class="navbar-item" href="./about.html">概要</a>
        <!-- <li><a href="./dungeon.html">ダンジョン</a></li> -->
      </div>
    </nav>
  </header>

  <main class="section">
    <div class="container">
      <h4 class="subtitle is-4">サモンズボード編成履歴</h4>
      <p class="content">
        「サモンズボード」で筆者が使用した編成を記録したサイトです。<br>
        最近使用した編成から新しいもの順に表示しています。
      </p>
      <p class="content">
        各項目の解説は<a href="./index-info.html">こちら</a>
      </p>

      <div class="level">
        <div class="field is-grouped">
          <div class="level-item">
            <span class="content is-small">表示数&nbsp;</span>
          </div>
          <div class="level-item">
            <input type="number" id="count" min="1" max="100" step="1" value="20" required class="input">
          </div>
          <div class="level-item">
            <!-- <span class="content is-small">表示数変更</span> -->
          </div>
          <div class="level-item">
            <div class="field has-addons">
              <p class="control">
                <button class="button" type="button" onclick="setNumber(20)">20</button>
              </p>
              <p class="control">
                <button class="button" type="button" onclick="setNumber(50)">50</button>
              </p>
              <p class="control">
                <button class="button" type="button" onclick="setNumber(100)">100</button>
              </p>
            </div>
          </div>
        </div>
      </div>
      <div class="column is-half content">
        <input type="search" id="keyword" placeholder="キーワード検索" class="input">
      </div>
      
      <div class="checkboxes content">
        <!-- <span id="filter-label" class="content is-small">FILTER</span> -->
        <label class="checkbox">
          <input type="checkbox" id="filter-metsu" role="switch" />
          <span class="">滅</span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="filter-metsuplus" role="switch" />
          <span class="">滅+</span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="filter-auto" role="switch" />
          <span class="">AUTO</span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="filter-daily" role="switch" />
          <span class="">日課</span>
        </label>
      </div>
      
      <div class="level">
        <div class="field is-grouped">
          <div class="level-item">
            <span id="results-status" role="status" class="content is-small">読み込み中...</span>
          </div>
          <div class="level-item">
            <div class="field has-addons">
              <!-- <span id="details-label">編成</span> -->
              <p class="control">
                <button type="button" id="open-all" class="button is-small">OPEN</button>
              </p>
              <p class="control">
                <button type="button" id="close-all" class="button is-small">CLOSE</button>
              </p>
            </div>
          </div>
          <div class="level-item">
            <button type="button" id="toggleBtn" class="button is-small" onclick="toggleArrow()" aria-label="昇順に切り替え" title="昇順に切り替え">&#9660;</button>
          </div>
        </div>
      </div>

      <div class="content formation-table is-hidden-mobile">
        <table class="table is-striped">
          <thead class="thead">
            <tr>
              <th>ダンジョン</th>
              <th>フロア</th>
              <th>ボス</th>
              <th>編成（配置）</th>
              <th>T</th>
              <th>AUTO</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
      <ul id="card-results" aria-label="編成一覧"></ul>

      <div class="content">
        <a class="" href="#top">TOPに戻る</a>
      </div>
    
    </div>
  </main>

  <footer class="footer" style="padding:3rem 1.5rem 3rem;">
    <div class="content has-text-centered">
      <h5 class="title is-4">Subolog</h4>
    </div>
  </footer>

  <script>
  const JSON_URL = './data.json';

  let allData = [];
  let metsuOnly = false;
  let metsuplusOnly = false;
  let autoOnly = false;
  let dailyOnly = false;
  let descending = true;

  // 表示する列名
  const columnNames = [
    'ダンジョン',
    'フロア',
    'ボス',
    'モンスター（配置）',
    'TURN',
    'AUTO',
    'MISSION'
  ];

  const keyword = document.getElementById('keyword');
  const results = document.getElementById('results');
  const cardResults = document.getElementById('card-results');
  const count = document.getElementById('count');
  const resultsStatus = document.getElementById('results-status');
  const filterMetsu = document.getElementById('filter-metsu');
  const filterMetsuplus = document.getElementById('filter-metsuplus');
  const filterAuto = document.getElementById('filter-auto');
  const filterDaily = document.getElementById('filter-daily');

  // JSONデータを取得
  async function loadData() {
    try {
      const response = await fetch(JSON_URL, {
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error('JSON取得エラー');
      }

      allData = await response.json();

      render();

    } catch (error) {
      console.error(error);
      resultsStatus.textContent = 'データ取得に失敗しました';
    }
  }

  function createCardField(label, value, className = '') {
    const field = document.createElement('div');
    field.className = className;
    const heading = document.createElement('span');
    heading.className = 'is-sr-only';
    heading.textContent = label;
    field.appendChild(heading);
    if (value instanceof Node) {
      field.appendChild(value);
    } else {
      field.appendChild(document.createTextNode(String(value ?? '').trim() || '—'));
    }
    return field;
  }

  // 検索・テーブルとカードの表示
  function render() {
    if (!count.checkValidity()) return;
    const displayCount = count.valueAsNumber;
    const q = keyword.value.trim().toLowerCase();

    const matched = allData.filter(row => {
      const rowValues = Object.values(row);
      const isMetsu = String(row['フロア'] ?? '').includes('滅】');
      const isMetsuplus = String(row['フロア'] ?? '').includes('滅+');
      // Auto列は表示時と同じくJSONの9番目（0始まり）を参照
      const hasAuto = String(rowValues[10] ?? '').trim() !== '';
      const isDaily = String(row['日課'] ?? '').trim() === '〇';
      const matchesKeyword = q === '' || rowValues.some(value =>
        String(value ?? '').toLowerCase().includes(q)
      );
      const matchesMetsu = (!metsuOnly && !metsuplusOnly) || (metsuOnly && isMetsu) || (metsuplusOnly && isMetsuplus);
      return matchesMetsu && (!autoOnly || hasAuto) && (!dailyOnly || isDaily) && matchesKeyword;
    });

    // 検索・絞り込み後の末尾から指定件数を表示
    const filtered = matched.slice(-displayCount);
    if (descending) filtered.reverse();

    resultsStatus.textContent = `${filtered.length}件表示（${matched.length}件のうち）`;

    results.replaceChildren();
    cardResults.replaceChildren();

    filtered.forEach((row, rowIndex) => {
      const tr = document.createElement('tr');

      // JSONの1、2、3、４、8、9、10番目を左から順に表示
      const rowValues = Object.values(row);
      const values = [1, 2, 3, 4, 9, 10, 11].map(index => rowValues[index]);
      const positions = String(rowValues[8] ?? '').split('');
      const formatMember = columnIndex => {
        const member = rowValues[columnIndex] ?? '';
        const position = positions[columnIndex - 4];
        return position === undefined ? String(member) : `${member} (${position})`;
      };

      const createMembers = () => {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const content = document.createElement('div');

        summary.textContent = '\u265A\u00a0' + formatMember(4);

        [5, 6, 7].forEach(columnIndex => {
          const line = document.createElement('div');
          line.textContent = formatMember(columnIndex);
          content.appendChild(line);
        });

        details.appendChild(summary);
        details.appendChild(content);
        return details;
      };

      values.forEach((value, index) => {
        const td = document.createElement('td');

        // 左から4番目（番号は0始まり）
        if (index === 3) {
          td.appendChild(createMembers());
        } else if (index === 6) {
          td.textContent = "詳細"
        } else {
          td.textContent = value ?? '';
        }

        tr.appendChild(td);
      });

      results.appendChild(tr);

      const cardItem = document.createElement('li');
      const card = document.createElement('div');
      card.className = 'card';
      card.style.fontSize = '0.875rem';
      const header = document.createElement('header');
      header.className = 'card-header';
      const headerItems = document.createElement('div');
      headerItems.className = 'card-header-items';
      const headerFirstRow = document.createElement('div');
      headerFirstRow.className = 'card-header-first-row';
      headerFirstRow.append(
        createCardField('ダンジョン', values[0]),
        createCardField('フロア', values[1])
      );
      headerItems.append(headerFirstRow, createCardField('ボス', values[2]));
      header.appendChild(headerItems);

      const content = document.createElement('div');
      content.className = 'card-content';
      content.append(
        createCardField('編成（配置）', createMembers())
      );

      const footer = document.createElement('footer');
      footer.className = 'card-footer';
      const turnValue = String(values[4] ?? '').trim();
      const note = String(values[6] ?? '').trim();
      let noteValue = '—';
      if (note) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'button is-small';
        button.textContent = '詳細';
        button.setAttribute('aria-expanded', 'false');
        button.setAttribute('aria-controls', `formation-note-${rowIndex}`);
        noteValue = button;

        const noteContent = document.createElement('div');
        noteContent.id = `formation-note-${rowIndex}`;
        noteContent.className = 'formation-card-note';
        noteContent.textContent = note;
        noteContent.hidden = true;
        content.appendChild(noteContent);
        button.addEventListener('click', () => {
          noteContent.hidden = !noteContent.hidden;
          button.setAttribute('aria-expanded', String(!noteContent.hidden));
        });
      }
      footer.append(
        createCardField('T', turnValue ? `${turnValue}ターン` : '—', 'card-footer-item'),
        createCardField('AUTO', values[5], 'card-footer-item'),
        createCardField('備考', noteValue, 'card-footer-item')
      );
      card.append(header, content, footer);
      cardItem.appendChild(card);
      cardResults.appendChild(cardItem);
    });
  }

  function setNumber(num) {
    document.getElementById("count").value = num;
    render();
  }

  function toggleArrow() {
    const btn = document.getElementById("toggleBtn");

    descending = !descending;
    btn.textContent = descending ? "▼" : "▲";
    const label = descending ? '昇順に切り替え' : '降順に切り替え';
    btn.setAttribute('aria-label', label);
    btn.title = label;
    render();
  }

  keyword.addEventListener('input', render);
  count.addEventListener('input', render);

  filterMetsu.addEventListener('change', () => {
    metsuOnly = filterMetsu.checked;
    render();
  });

  filterMetsuplus.addEventListener('change', () => {
    metsuplusOnly = filterMetsuplus.checked;
    render();
  });

  filterAuto.addEventListener('change', () => {
    autoOnly = filterAuto.checked;
    render();
  });

  filterDaily.addEventListener('change', () => {
    dailyOnly = filterDaily.checked;
    render();
  });

  document.getElementById('open-all').addEventListener('click', () => {
    document.querySelectorAll('#results details, #card-results details').forEach(details => {
      details.open = true;
    });
  });

  document.getElementById('close-all').addEventListener('click', () => {
    document.querySelectorAll('#results details, #card-results details').forEach(details => {
      details.open = false;
    });
  });

  const navbarBurger = document.querySelector('.navbar-burger');
  const navbarMenu = document.getElementById('site-navbar-menu');
  navbarBurger.addEventListener('click', () => {
    const isOpen = navbarBurger.classList.toggle('is-active');
    navbarMenu.classList.toggle('is-active', isOpen);
    navbarBurger.setAttribute('aria-expanded', String(isOpen));
  });

  loadData();
  </script>

</body>
</html>
