<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./style.css">

  <title>統計&nbsp;&#45;&nbsp;Subolog</title>

</head>
<body>
  <header class="site-header" id="top" tabindex="-1">
    <h3 class="site-title">
      <a href="./index.html">Subolog</a>
    </h3>

    <nav class="site-nav" aria-label="メインナビゲーション">
      <ul>
        <li><a href="./index.html">編成</a></li>
        <li><a href="./statistics.html" aria-current="page">統計</a></li>
        <!-- <li><a href="./dungeon.html">ダンジョン</a></li> -->
        <li><a href="./about.html">概要</a></li>
      </ul>
    </nav>
  </header>
  <main class="main-background statistics-page">
    <div class="container">
    <h2>モンスター使用回数の統計</h2>
    <p id="statistics-description">
        <!--キャラクター毎の使用回数の統計です。<br> -->
        <details>
            <summary>各列とチェックボックスの解説</summary>
                「編&nbsp;/&nbsp;全」列は「編成に採用された回数 / 延べ採用数」を表示します。<br>
                延べ採用数は、複数体採用した場合に採用したキャラクターの数を集計した結果です。<br>
                <br>
                「L&nbsp;/&nbsp;Sub」列は「リーダー採用数 / サブ1〜3の延べ採用数」を表示します。<br>
                <br>
                「AUTOのみ」をONにすると、Auto欄に値がある編成だけを集計します。
        </details>
    </p>
    <p class="statistics-search">
      <label for="keyword">キャラクター名検索</label>
      <input type="search" id="keyword" placeholder="キャラクター名を入力" aria-controls="statistics-results" disabled>
    </p>

    <div class="statistics-dates" role="group" aria-labelledby="statistics-dates-label" aria-describedby="statistics-dates-help">
      <span id="statistics-dates-label">集計期間</span>
      <label for="start-date"><input type="date" id="start-date" aria-controls="statistics-results" disabled></label>
      <span>&ndash;</span>
      <label for="end-date"><input type="date" id="end-date" aria-controls="statistics-results" disabled></label>
      <button type="button" id="past-30-days" aria-controls="statistics-results" disabled>過去30日</button>
      <button type="button" id="past-90-days" aria-controls="statistics-results" disabled>過去90日</button>
      <button type="button" id="clear-dates" aria-controls="statistics-results" disabled>全期間</button>
      <!-- <span>&nbsp;※開始日・終了日を含めて集計</span> -->
    </div>
    <!-- <p id="statistics-dates-help">開始日・終了日を含めて集計します。空欄の場合は、その側の日付を制限しません。</p> -->
    
    <div class="statistics-targets" role="group" aria-labelledby="statistics-targets-label">
      <span id="statistics-targets-label">集計対象</span>
      <label><input type="checkbox" id="include-leader" aria-controls="statistics-results" checked disabled>リーダー</label>
      <label><input type="checkbox" id="include-sub" aria-controls="statistics-results" checked disabled>サブ</label>
      <label><input type="checkbox" id="auto-only" aria-controls="statistics-results" disabled>AUTOのみ</label>
    </div>

    <p id="statistics-status" role="status">データを読み込み中...</p>

    <div class="table-container statistics-table-container" role="region" aria-label="キャラクター採用統計表" tabindex="0">
      <table class="statistics-table" aria-describedby="statistics-description">
        <thead>
          <tr>
            <th scope="col">順位</th>
            <th scope="col">キャラクター名</th>
            <th scope="col">編&nbsp;/&nbsp;全</th>
            <th scope="col">L&nbsp;/&nbsp;Sub</th>
          </tr>
        </thead>
        <tbody id="statistics-results"></tbody>
      </table>
    </div>
    <p>
      <a class="back-to-top" href="#top" aria-label="ページの先頭に戻る">TOPに戻る</a>
    </p>
  </div>
  </main>
  <footer class="site-footer">
    <small class="site-footer-title">Subolog</small>
  </footer>
  <script>
    const memberColumns = ['リーダー', 'サブ1', 'サブ2', 'サブ3'];
    const statisticsResults = document.getElementById('statistics-results');
    const statisticsStatus = document.getElementById('statistics-status');
    const keyword = document.getElementById('keyword');
    const statisticsRows = [];
    const includeLeader = document.getElementById('include-leader');
    const includeSub = document.getElementById('include-sub');
    const autoOnly = document.getElementById('auto-only');
    const startDate = document.getElementById('start-date');
    const endDate = document.getElementById('end-date');
    const clearDates = document.getElementById('clear-dates');
    const past30Days = document.getElementById('past-30-days');
    const past90Days = document.getElementById('past-90-days');
    let allData = [];

    function filterCharacters() {
      const query = keyword.value.trim().toLowerCase();
      for (const { row, name } of statisticsRows) {
        row.hidden = !name.toLowerCase().includes(query);
      }
    }

    keyword.addEventListener('input', filterCharacters);
    includeLeader.addEventListener('change', renderStatistics);
    includeSub.addEventListener('change', renderStatistics);
    autoOnly.addEventListener('change', renderStatistics);
    startDate.addEventListener('input', renderStatistics);
    endDate.addEventListener('input', renderStatistics);
    past30Days.addEventListener('click', () => setRecentPeriod(30));
    past90Days.addEventListener('click', () => setRecentPeriod(90));
    clearDates.addEventListener('click', () => {
      startDate.value = '';
      endDate.value = '';
      renderStatistics();
    });

    function setRecentPeriod(days) {
      const today = new Date();
      const start = new Date(today);
      start.setDate(start.getDate() - (days - 1));
      const formatDate = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      startDate.value = formatDate(start);
      endDate.value = formatDate(today);
      renderStatistics();
    }

    async function loadStatistics() {
      try {
        const response = await fetch('./data.json', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('JSON取得エラー');
        }
        allData = await response.json();
        renderStatistics();
        keyword.disabled = false;
        includeLeader.disabled = false;
        includeSub.disabled = false;
        autoOnly.disabled = false;
        startDate.disabled = false;
        endDate.disabled = false;
        clearDates.disabled = false;
        past30Days.disabled = false;
        past90Days.disabled = false;
      } catch (error) {
        console.error(error);
        statisticsStatus.textContent = 'データの読み込みに失敗しました。時間をおいて再読み込みしてください。';
      }
    }

    function renderStatistics() {
      const start = startDate.value;
      const end = endDate.value;
      const reversed = Boolean(start && end && start > end);
      startDate.setAttribute('aria-invalid', String(!startDate.validity.valid || reversed));
      endDate.setAttribute('aria-invalid', String(!endDate.validity.valid || reversed));
      if (!startDate.validity.valid || !endDate.validity.valid || reversed) {
        statisticsRows.length = 0;
        statisticsResults.replaceChildren();
        statisticsStatus.textContent = reversed
          ? '開始日は終了日以前の日付を指定してください。'
          : '開始日・終了日に有効な日付を入力してください。';
        return;
      }
      const data = allData.filter(row => {
        if (autoOnly.checked && String(row.Auto ?? '').trim() === '') return false;
        if (!start && !end) return true;
        const date = String(row['日時'] ?? '').trim().replaceAll('/', '-');
        return /^\d{4}-\d{2}-\d{2}$/.test(date)
          && (!start || date >= start) && (!end || date <= end);
      });
      const columns = [
        ...(includeLeader.checked ? memberColumns.slice(0, 1) : []),
        ...(includeSub.checked ? memberColumns.slice(1) : [])
      ];
      statisticsRows.length = 0;
      const counts = new Map();
      const formationCounts = new Map();
      const leaderCounts = new Map();
      const subCounts = new Map();
      let total = 0;

      for (const row of data) {
        const members = new Set();
        for (const column of columns) {
          const name = String(row[column] ?? '').trim();
          if (!name || name.startsWith('※')) continue;
          counts.set(name, (counts.get(name) ?? 0) + 1);
          const roleCounts = column === memberColumns[0] ? leaderCounts : subCounts;
          roleCounts.set(name, (roleCounts.get(name) ?? 0) + 1);
          members.add(name);
          total++;
        }
        for (const name of members) {
          formationCounts.set(name, (formationCounts.get(name) ?? 0) + 1);
        }
      }

      const sorted = [...counts].sort((a, b) =>
        b[1] - a[1] || a[0].localeCompare(b[0], 'ja')
      );
      const fragment = document.createDocumentFragment();
      let rank = 0;
      sorted.forEach(([name, count], index) => {
        if (index === 0 || count !== sorted[index - 1][1]) rank = index + 1;
        const tr = document.createElement('tr');
        const values = [
          rank,
          name,
          `${formationCounts.get(name).toLocaleString('ja-JP')} / ${count.toLocaleString('ja-JP')}`,
          `${(leaderCounts.get(name) ?? 0).toLocaleString('ja-JP')} / ${(subCounts.get(name) ?? 0).toLocaleString('ja-JP')}`
        ];
        for (const value of values) {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        }
        fragment.appendChild(tr);
        statisticsRows.push({ row: tr, name });
      });
      statisticsResults.replaceChildren(fragment);
      filterCharacters();
      if (columns.length === 0) {
        statisticsStatus.textContent = '集計対象を選択してください。';
        return;
      }
      const targetLabel = [includeLeader.checked ? 'リーダー' : '', includeSub.checked ? 'サブ' : ''].filter(Boolean).join('・');
      statisticsStatus.textContent = sorted.length
        ? `${autoOnly.checked ? 'AUTO / ' : ''}${targetLabel} / ${data.length.toLocaleString('ja-JP')}件の記録 / ${counts.size.toLocaleString('ja-JP')}種類 / 延べ${total.toLocaleString('ja-JP')}回（延べ採用数の多い順・同数は同順位）`
        : '集計対象のデータがありません。';
    }

    loadStatistics();
  </script>
</body>
</html>
